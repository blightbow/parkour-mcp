[project]
name = "parkour-mcp"
version = "2.2.0"
description = "A content exploration toolkit that helps LLMs surface high signal, unsummarized web content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "blightbow" }
]
dependencies = [
    "betamatter>=0.1.0",
    # Upper bound is load-bearing: mcp 2.0.0 moved `mcp.server.fastmcp.*`
    # to `mcp.server.mcpserver.*` with no compat shim, so an unbounded
    # resolve ImportErrors at `import parkour_mcp`. Lockfiles do not travel
    # to PyPI consumers, so the ceiling has to live here. `>=1.28,<2` is
    # upstream's own holding pattern for the v1 maintenance line, and the
    # floor is now expressible: semgrep used to drag `mcp==1.23.3` into the
    # dev resolve, so the lock sat six minors below what a consumer install
    # got. It is a tool now, not a dependency (see the `dev` group), and the
    # lock tracks what users actually resolve.
    "mcp[cli]>=1.28,<2",
    "kagiapi",
    "beautifulsoup4",
    "httpx[http2]",
    "curl-cffi>=0.15.0",
    "playwright",
    "markdownify",
    "semantic-text-splitter>=0.29.0",
    "tantivy>=0.25.1",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.24",
    "htmd-py>=0.1.2",
    "yt-dlp>=2026.3.17",
    "youtube-transcript-api>=1.2.4",
    "defusedxml>=0.7.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
grammars = [
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-kotlin>=0.23",
    "tree-sitter-scala>=0.23",
]

[project.urls]
Homepage = "https://github.com/blightbow/parkour-mcp"
Repository = "https://github.com/blightbow/parkour-mcp"
Issues = "https://github.com/blightbow/parkour-mcp/issues"

[project.scripts]
parkour-mcp = "parkour_mcp:main"

# Hermes Agent discovers plugins exposing this entry-point group and calls
# `register(ctx)` on the referenced module. The same installed wheel is both
# the `parkour-mcp` MCP server and a native Hermes plugin; the entrypoint
# decides which. See parkour_mcp/hermes_plugin.py.
[project.entry-points."hermes_agent.plugins"]
parkour = "parkour_mcp.hermes_plugin"

[tool.setuptools.packages.find]
exclude = ["tmp*", "tests*", "scripts*"]

[tool.setuptools.package-data]
# Ship image assets inside the wheel so they resolve under site-packages
# when installed via `uv tool install parkour-mcp` (or `uvx parkour-mcp`).
# The mcpb bundle references the same package-local path via manifest.json,
# giving us one source of truth for both distribution channels.
parkour_mcp = [
    "assets/icon.png",
    "assets/icon.svg",
    "assets/icons/*.svg",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Opt-in collection: explicitly list the directories pytest should walk,
# rather than excluding exploratory/build dirs one at a time. pytest-ruff
# hooks `pytest_collect_file` and emits a ruff lint item for every `.py`
# file pytest walks during collection, so putting `parkour_mcp/` and
# `scripts/` in testpaths keeps them under ruff's and ty's watch alongside the
# test suite itself. Directories not listed here (`tmp/`, `bakeoff/`,
# `build/`, `.venv/`, `dist/`, etc.) are excluded by construction without
# depending on pytest's internal default `norecursedirs` list.
testpaths = ["parkour_mcp", "tests", "scripts"]
markers = [
    "live: live integration tests hitting real endpoints (deselected by default, run with -m live)",
    "perf: performance regression tests using captured fixtures (deselected by default, run with -m perf)",
    "requires_live(*keys): third-party hosts this test needs; probed once per session by the liveness gate in tests/conftest.py, which fails the test by name and status code when a host is not serving",
]
addopts = "-m 'not live and not perf' --ruff --ty"

[tool.ty.src]
# Vulture whitelist uses bare name references that don't resolve at parse
# time; vulture only parses the file, never imports it.
exclude = [".vulture_whitelist.py"]

[tool.ruff.lint]
# Lint selection targets anti-patterns worth a second look when pytest-ruff
# rejects a change. Cosmetic groups (C4, RET, SIM, UP) are meant to be
# auto-applied; the others gate at review.
#
# This is `extend-select`, so ruff's own default rule set is the floor and this
# list only adds to it. Two properties follow, and both are the reason for the
# choice.
#
# Declining a rule costs something. To switch off anything ruff enables by
# default you have to write an `ignore` entry below, with a reason, where a
# reviewer can find it and check it. Under `select` the same outcome is reached
# by leaving a rule off a list, which leaves no trace, needs no reason, and no
# checker will ever flag. RUF100 expires a stale `noqa`; nothing expires a
# silent omission. Given how much of this repo is written by an LLM working from
# partial context, the posture that makes "just don't enforce it" the expensive
# option is the correct one.
#
# Upstream stays the floor, and upstream improves. Ruff's curation is imperfect
# (0.16.0 dropped F406 by its maintainer's own account as an oversight, tracked
# in astral-sh/ruff#27213) but it is maintained against the whole ecosystem and
# it self-corrects. Inheriting it means those corrections arrive on a version
# bump instead of requiring someone here to notice.
#
# Version drift is handled by the dependency, not by this list: the dev group
# pins `ruff>=0.16.0,<0.17.0`, and upstream only changes defaults on a minor
# release. So the default set cannot move underneath this file without a
# deliberate edit to the ceiling.
#
# Some groups are deliberately not added on top of the default:
#   TC001-TC003 move imports into `if TYPE_CHECKING:`. The MCP SDK resolves tool
#       signatures with `inspect.signature(..., eval_str=True)`, so a
#       TYPE_CHECKING-only name is absent from `__globals__` at registration and
#       raises InvalidSignature. Ruff does not enable them by default, so there
#       is nothing to switch off; this note exists to stop a future session
#       adding them. TC004, which catches the converse (a TYPE_CHECKING import
#       that is needed at runtime), is default-enabled and welcome.
#   TID252 (parent-relative imports) finds nothing here: this package uses
#       sibling imports (`from .x`), which it permits. TID253 *is* selected
#       below, a different rule and the escape hatch PLC0415 defers to.
#   ANN is not enabled by default and is not added, so ANN401 needs no entry.
extend-select = [
    # Ruff's pre-0.16 default set, restored. 0.16.0 dropped 18 of these and
    # describes them as "more opinionated" pycodestyle and pyflakes rules, which
    # fits most of them and not all: F406 flags `import *` inside a function and
    # F722 a malformed forward annotation, both of which CPython rejects with
    # SyntaxError; upstream concedes F406 was an oversight
    # (astral-sh/ruff#27213). E402 is load-bearing in tests/conftest.py, where
    # imports must follow init_tool_names().
    "E4",       # imports: one-per-line, placement
    "E7",       # statement-level: comparisons, ambiguous names, lambda assign
    "E9",       # runtime: syntax and IO errors
    "F",        # pyflakes: undefined names, unused imports, format strings
    "BLE",      # blind-except: catching Exception naked
    "TRY",      # tryceratops: error-handling anti-patterns
    "PLC0415",  # import-outside-top-level: lazy imports masking cycles/deps
    "TID253",   # banned-module-level-imports: the declarative half of PLC0415
    "C4",       # comprehensions
    "FBT",      # boolean traps
    "RET",      # return practices
    "SIM",      # simplifications
    "UP",       # pyupgrade
    "T20",      # print/pprint
    "G",        # logging format
    "LOG",      # logging misuse
    "PLR",      # pylint refactor/complexity
    "S",        # bandit security
    "RUF100",   # unused-noqa: a suppression that stops suppressing is rot
]
ignore = [
    "FBT001",   # boolean positional hint — tool parameters surface bools deliberately
    "FBT002",   # boolean positional default — same
    "PLR0913",  # too-many-arguments — arity is schema/pydantic-driven
    "PLR2004",  # magic value — HTTP status codes and timeouts are domain constants
    "S101",     # assert — invariants in source, and the idiom in tests
    "TRY003",   # long exception messages — informative here
    # Complexity gates are unused: several fast-path dispatchers are large by
    # design, where the rule pushes fragmentation over a single clear flow.
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0915",  # too-many-statements
]

[tool.ruff.lint.flake8-tidy-imports]
# Modules that must NEVER be imported at module level. PLC0415 defers to this
# list, so a lazy import of anything here needs no per-site `noqa` — the policy
# lives once, here, instead of being restated at each call site where it can
# drift from the truth.
#
# TID253 enforces the other direction too: adding a top-level import of one of
# these is an error. That bidirectional property is the point. A `noqa` decays
# because nothing re-checks its stated reason; this cannot, because ruff
# rejects the arrangement the comment was describing.
#
# Entry criteria, per the PLC0415 rule docs, which recognise exactly three
# grounds for a function-scope import: avoiding a circular dependency,
# deferring a costly module load, or skipping a dependency entirely in some
# runtime environment. Costs below are marginal import time measured after
# `import parkour_mcp`, not cold `-X importtime` (which double-counts stdlib
# the server has already paid for).
banned-module-level-imports = [
    # Costly load. Only the YouTube and GGUF/CITATION paths need these, and a
    # server that never touches them should not pay for them at startup.
    "yt_dlp",                        # ~28 ms
    "yaml",                          # ~11 ms
    # Costly load, reached transitively: fetch_js pulls playwright (~8-17 ms),
    # and only the requires_js / actions branch of web_fetch_direct needs it.
    "parkour_mcp.fetch_js",
    # Skipped entirely in a runtime environment. hermes_cli is supplied by the
    # Hermes host; parkour declares an entry point *into* Hermes and does not
    # depend on it, so it is absent from parkour's own env and a module-level
    # import makes hermes_plugin.py unimportable outside a Hermes runtime.
    "hermes_cli",
    # Skipped entirely in a runtime environment. Semantic Scholar is gated on
    # an explicit terms-of-service opt-in (S2_ACCEPT_TOS); an opt-out install
    # should not load the client at all. The cost is negligible — the reason
    # is the opt-in, not the milliseconds.
    "parkour_mcp.semantic_scholar",
]

[tool.ruff.lint.per-file-ignores]
# Vulture whitelist: bare name references are the format vulture requires
# to count a symbol as "used". Those references are undefined at parse
# time by design — ruff's F821 would otherwise flag every entry.
# B018 (useless expression) is the same fact seen from the other side: a bare
# name with no effect is precisely what this file is made of, and what makes it
# work. Both rules describe the format correctly and neither is actionable here,
# because the alternative is a file vulture cannot read.
".vulture_whitelist.py" = ["F821", "B018"]
# Tests use asserts (S101), fixture credentials (S105/S106), unused fixture
# arguments (ARG), and lazy respx-style imports (PLC0415). A security finding
# inside a test (unsafe XML, a bind-all literal, a subprocess call) is fixed or
# noqa'd on its line, not waived here, so new tests stay covered.
# TID253 too: the banned-module-level list expresses parkour_mcp's own
# startup-cost and opt-in policy. A test or script importing those modules at
# top level is doing exactly what it should — it is not a server startup path.
"tests/**/*.py" = ["S101", "S105", "S106", "ARG", "PLC0415", "TID253"]
# Build and CLI scripts print by design (T201) and lazy-import build-only
# dependencies (PLC0415). BLE001 is a category exemption of the same kind, not a
# waived finding: a script's failure path reports to the operator running it via
# `print` or `sys.exit`, so a broad catch there terminates or annotates one
# invocation rather than silently degrading a long-lived server. In the package
# the opposite holds and BLE001 is enforced. Security and quality findings are
# still fixed on the line, not waived here.
"scripts/**/*.py" = ["T201", "PLC0415", "TID253", "BLE001"]

[dependency-groups]
dev = [
    "cogapp>=3.6.0",
    "commitizen>=4.10",
    "fonttools>=4.62",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    # Declared directly, not inherited from pytest-ruff, and capped below the
    # next minor. Ruff's default rule set is not a stable interface: 0.16.0
    # both added 354 rules and silently withdrew 18 that had been on since
    # 0.1.0. `[tool.ruff.lint] select` pins which rules run, but only a version
    # bound decides *when* this repo absorbs the next such change. The ceiling
    # makes that a commit rather than a resolver outcome.
    "ruff>=0.16.0,<0.17.0",
    "pytest-ruff>=0.5",
    "pytest-ty>=0.2.1",
    "respx>=0.22.0",
    # semgrep is deliberately NOT here. tests/test_semgrep_rules.py shells
    # out to the binary via shutil.which(); nothing imports the package, so
    # it is a tool, not a library dependency. Declaring it here dragged its
    # hard `mcp==1.23.3` pin into our resolve (semgrep/semgrep#11476 — an
    # exact pin held on purpose, and semgrep/semgrep#11808 keeps it exact
    # while moving to 1.28.1), which capped our own mcp version and made the
    # dev environment resolve differently from a consumer install. Install
    # it out-of-tree instead: `brew install semgrep`, or `uv tool install
    # semgrep` — which is what semgrep's own maintainers recommend for this
    # conflict (semgrep/semgrep#11506).
    "tabulate>=0.9",
    "tree-sitter-python>=0.23",
    "vulture>=2.16",
]

# ---------------------------------------------------------------------------
# Release tooling.
#
# git-cliff owns CHANGELOG.md. It parses Conventional Commits from git
# history and extracts `Why:` trailers into user-facing narrative. No
# news fragments: commits carry their own release-note content via the
# `Why:` trailer discipline (see CLAUDE.md).
#
# commitizen owns version determination. `cz bump` reads
# `project.version` (pep621 provider), computes the next PEP 440 version
# (pep440 scheme; critical for PyPI compatibility on both finals and
# RCs), and writes it back. The release slash command chains:
#   cz bump --version-files-only (stage pyproject bump)
#   -> git cliff --tag v$NEW --unreleased --prepend CHANGELOG.md
#   -> sync_versions.py (mirror into manifest.json, server.json)
#   -> git commit + just tag (test gate + annotated tag at HEAD).
# PyPI upload and GitHub Release creation stay in CI on tag push.
# ---------------------------------------------------------------------------

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to parkour-mcp will be documented in this file.

Format: https://keepachangelog.com/en/1.1.0/
Versioning: https://semver.org/spec/v2.0.0.html

"""
body = """
## [{% if version %}{{ version | trim_start_matches(pat="v") }}{% else %}unreleased{% endif %}]{% if timestamp %} {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
{%- set why = commit.footers | filter(attribute="token", value="Why") | first -%}
{%- if why -%}
{%- set flat = why.value | replace(from="\n", to=" ") | replace(from="  ", to=" ") | replace(from="  ", to=" ") | trim -%}
- {{ flat }}
{% else -%}
- {{ commit.message | upper_first | trim }}
{% endif -%}
{% endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.git]
# The HTML comment prefix on each `group` value is a documented workaround
# for git-cliff's default alphabetical group ordering (it does not honor
# the order commit_parsers are declared in). The `striptags | trim` filter
# in the body template strips the prefix before rendering. Without this,
# "Documentation" would appear above "Fixed" in every release.
commit_parsers = [
  # Security scope convention: any commit with `(security)` scope routes
  # to the Security section regardless of type. This matters because
  # Conventional Commits has no `security` type; we need to piggyback on
  # existing types. Matches feat(security), fix(security), test(security),
  # chore(security). Anchored to the commit header (`^<type>(security)`)
  # so an incidental `(security)` mention in a commit body does not
  # falsely route the commit to the Security section.
  #
  # MUST stay first: git-cliff applies commit_parsers first-match-wins.
  # Below `^feat` / `^fix` this rule would never be reached, and
  # feat(security) / fix(security) commits would leak into Added / Fixed.
  { message = "^[a-z]+\\(security\\)", group = "<!-- 3 -->Security" },
  # Merge commits carry no conventional type ("Merge branch ..."). With
  # `filter_unconventional = false` (below) they no longer raise a parse
  # error, but they would then surface a *grouping* error instead since they
  # match no group. This rule skips them so neither warning fires. Both
  # settings are required: remove either and the warning returns (as a parse
  # error without `filter_unconventional = false`, as a grouping error
  # without this rule).
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Miscellaneous" },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^release", skip = true },
]
filter_commits = true
# Fold PEP 440 pre-release tags (rcN, aN, bN) into the next release rather
# than letting them open their own changelog section. Without this, a range
# anchored to the last final tag (e.g. v1.2.0..v2.0.0rc1) spans the
# intermediate v2.0.0rc0 tag, and git-cliff emits a separate `## [2.0.0rc0]`
# section, so a later RC's (or the final's) notes replay the earlier RC's
# entries header and all. Folding requires the consumer to name the current
# section explicitly with `--tag` (an ignored tag yields `## [unreleased]`
# otherwise); both the CI release-notes step and the local /release flow do.
ignore_tags = "(a|b|rc)[0-9]+$"
# Treat non-conventional commits (merges, the rare "wip"/"fixup") as ordinary
# commits rather than parse errors, silencing git-cliff's "skipped due to
# parse error(s)" warning. They still produce no changelog output: the
# `^Merge ` parser above skips merges, and `filter_commits = true` drops any
# remaining commit that matches no group.
filter_unconventional = false

[tool.commitizen]
name = "cz_conventional_commits"
# pep621 provider reads `project.version` from pyproject.toml (single
# source of truth). sync_versions.py fans the value out to manifest.json
# (PEP 440 -> strict SemVer for Claude Desktop) and server.json (verbatim).
version_provider = "pep621"
# pep440 scheme is the reason we chose commitizen over python-semantic-
# release: it emits PEP 440 versions (including correct RC form like
# `1.2.0rc1`) instead of SemVer-with-dashes that would break `uv build`.
version_scheme = "pep440"
tag_format = "v$version"
bump_message = "release: v$new_version"
# towncrier owns CHANGELOG.md. commitizen's own changelog generator
# would produce a conflicting format, so keep it off.
update_changelog_on_bump = false
major_version_zero = false
