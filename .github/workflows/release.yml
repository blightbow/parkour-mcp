name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # gh release create + asset upload
  id-token: write    # PyPI trusted publisher + MCP Registry OIDC

# One release run per tag. A tag delivered as two push events (GitHub
# double-dispatch, or a manual re-push) would otherwise spawn racing
# runs that collide on the PyPI upload and `gh release create`.
# cancel-in-progress is false: never interrupt an in-flight release —
# a late duplicate queues and then fails fast on the duplicate upload
# rather than risking a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff walks the full commit history and tag graph to
          # assemble release notes; checkout's default depth-1 shallow
          # fetch starves it. 0 = full history plus all tags.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # A clean vX.Y.Z tag is a final release; anything else (rc0,
          # a1, b2, ...) is a pre-release and must not be published as
          # GitHub's "Latest". PEP 440 RC tags carry no `-`, so a
          # SemVer-style dash check would miss them.
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches pyproject and version files are in sync
        # The tag's numeric suffix must match pyproject.toml. sync_versions.py
        # then verifies that manifest.json (strict SemVer, translated from
        # PEP 440) and server.json (PEP 440 verbatim) agree with pyproject.
        # Drift here means a hand-edit slipped past the local `just tag` gate.
        run: |
          pkg=$(uv run python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ steps.version.outputs.version }}" != "$pkg" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match pyproject.toml version $pkg"
            exit 1
          fi
          uv run python3 scripts/sync_versions.py --check

      - name: Install semgrep
        # Not in the `dev` dependency group: tests/test_semgrep_rules.py
        # shells out to the binary and never imports the package, and
        # declaring it dragged semgrep's hard `mcp==1.23.3` pin into our
        # resolve. The runner has no semgrep, and a missing binary fails
        # the suite rather than skipping it (deliberately — the ruleset is
        # a security gate), so it has to be installed before the test step.
        run: |
          uv tool install semgrep
          # GITHUB_PATH applies to later steps; export for this one's check.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          semgrep --version

      - name: Run tests
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publisher, no token needed.
        # Configure at: https://pypi.org/manage/account/publishing/

      - name: Pack mcpb bundle
        # Bundles are shipped unsigned. mcpb 2.1.2 has two stacked bugs:
        # - #21: `mcpb verify` always reports "unsigned" (node-forge p7.verify is unimplemented)
        # - #194: signed bundles fail Claude Desktop's strict ZIP parser (EOCD comment_length not patched)
        # Community norm is unsigned + the standard "unsigned extension" warning.
        # Revisit when Anthropic publishes a fix that includes both #195 and #204.
        run: npx --yes @anthropic-ai/mcpb pack . dist/parkour-mcp.mcpb

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Assemble release notes
        # CHANGELOG.md wins when it carries a section for this exact
        # version; git-cliff fills in when it does not.
        #
        # CHANGELOG-first is the correct precedence, not a workaround.
        # For a final release, /release step 3 already wrote git-cliff's
        # output INTO CHANGELOG.md, and step 4 explicitly invites the
        # author to tighten the wording before committing. So the two
        # sources agree except where a human deliberately improved one of
        # them — and regenerating here would silently discard exactly
        # those edits. Reading CHANGELOG.md makes the file in the repo and
        # the GitHub Release body incapable of disagreeing.
        #
        # RCs take the git-cliff branch by construction: CHANGELOG.md
        # tracks final releases only, so the lookup finds no
        # `## [X.Y.ZrcN]` section and falls through.
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          # Content = anything that is not a blank line or a `## [version]`
          # section header. git-cliff emits that header even when every
          # commit in range was filtered out, so a size check would read
          # as "notes exist" and publish an empty release body.
          has_content() {
            grep -vE '^[[:space:]]*$|^## \[' "$1" | grep -q '[^[:space:]]'
          }

          awk -v v="## [$version]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/  { exit }
            found              { print }
          ' CHANGELOG.md > release-notes.md

          if has_content release-notes.md; then
            echo "::notice::Release notes sourced from CHANGELOG.md section ## [$version]"
          else
            echo "::notice::No CHANGELOG.md section for $version; assembling from commits"
            # The range is anchored to the last FINAL tag, not --current /
            # --latest: those cut at the adjacent git tag, so a release
            # published after intervening rcN pre-release tags would report
            # only the rc-period commits. Selecting the most recent vX.Y.Z
            # ancestor makes an RC report the whole body of work since the
            # previous final release.
            last_final=$(git tag --list 'v*' --merged "$tag" --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vFx "$tag" | head -1 || true)
            # An absent prior final tag would build the malformed range
            # "..$tag"; fall back to the whole history in that case.
            #
            # --tag "$tag" is REQUIRED, not cosmetic: pyproject's
            # `ignore_tags` folds intermediate rcN tags so they don't open
            # their own `## [rcN]` section inside this range. But a folded
            # current tag would otherwise render as `## [unreleased]`, so
            # --tag names the single section explicitly. --strip all drops
            # the header/footer so the output feeds `--notes-file`.
            if [ -n "$last_final" ]; then
              git cliff --tag "$tag" "${last_final}..${tag}" --strip all -o release-notes.md
            else
              git cliff --tag "$tag" --strip all -o release-notes.md
            fi
          fi

          if ! has_content release-notes.md; then
            echo "::error::No release notes for $tag. A release needs either a '## [$version]' section in CHANGELOG.md or Conventional Commits in range that match a commit_parsers rule."
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            dist/parkour-mcp.mcpb

      - name: Install mcp-publisher
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Render server.json with mcpb asset coordinates
        # server.json already has the correct version (sync_versions.py
        # wrote it during the release commit). Only the mcpb-specific
        # fields (download URL + sha256) need to be updated here because
        # they can't be known until after the bundle is packed.
        run: |
          sha256=$(sha256sum dist/parkour-mcp.mcpb | cut -d' ' -f1)
          url="https://github.com/blightbow/parkour-mcp/releases/download/${{ steps.version.outputs.tag }}/parkour-mcp.mcpb"
          uv run python3 scripts/render_server_json.py --identifier "$url" --sha256 "$sha256"
          cat server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
