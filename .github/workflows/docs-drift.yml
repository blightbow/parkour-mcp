name: docs-drift

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "parkour_mcp/**"
      - "scripts/cog_helpers.py"
      - "scripts/tools.toml"
      - "scripts/check_manifest_tools.py"
      - "manifest.json"
      - "drift.lock"
      - ".github/workflows/docs-drift.yml"

# Read-only: this workflow checks docs against code and writes nothing.
# Declared explicitly rather than inherited, so a change to the repository
# default cannot silently widen what the token can do.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # drift's blame attribution wants real history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.12
      - run: uv sync

      - name: Install drift (Fiberplane Drift)
        run: |
          curl -sSfL https://drift.fp.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cog --check
        run: uv run cog --check --check-fail-msg='Run "just docs-drift-fix" to regenerate.' CLAUDE.md README.md docs/frontmatter-standard.md

      - name: drift check
        run: drift check

      - name: manifest.json tools match registration
        run: uv run python3 scripts/check_manifest_tools.py
